[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/config",
  "crates/scheduler",
  "crates/capacity",
  "crates/coordinator",
  "crates/providers",
  "crates/proxy",
  "crates/simulator",
  "crates/cli",
  "crates/fake-provider",
  "crates/provider-sdk",
  "crates/durable-queue",
  "crates/identity",
  "crates/telemetry",
  "crates/provider-protocol",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/dlamaro96/inferqos"
homepage = "https://dlamaro96.github.io/inferqos"
authors = ["InferQoS contributors"]

[workspace.dependencies]
inferqos-capacity = { path = "crates/capacity", version = "0.2.0" }
inferqos-config = { path = "crates/config", version = "0.2.0" }
inferqos-coordinator = { path = "crates/coordinator", version = "0.2.0" }
inferqos-core = { path = "crates/core", version = "0.2.0" }
inferqos-identity = { path = "crates/identity", version = "0.2.0" }
inferqos-telemetry = { path = "crates/telemetry", version = "0.2.0" }
inferqos-provider-protocol = { path = "crates/provider-protocol", version = "0.2.0" }
inferqos-providers = { path = "crates/providers", version = "0.2.0" }
inferqos-proxy = { path = "crates/proxy", version = "0.2.0" }
inferqos-scheduler = { path = "crates/scheduler", version = "0.2.0" }
inferqos-simulator = { path = "crates/simulator", version = "0.2.0" }
anyhow = "1.0"
async-trait = "0.1"
async-nats = "0.50"
aws-config = { version = "1.12", default-features = false, features = ["behavior-version-latest", "credentials-process", "default-https-client", "rt-tokio", "sso"] }
aws-credential-types = "1.3"
aws-sigv4 = { version = "1.5", features = ["http1", "sign-http"] }
azure_core = "1.1"
azure_identity = "1.0"
axum = { version = "0.8", features = ["http2", "macros"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dashmap = "6.1"
futures-util = "0.3"
http = "1.3"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }
humantime-serde = "1.1"
ipnet = "2.12"
jsonwebtoken = { version = "10.2", default-features = false, features = ["aws_lc_rs"] }
google-cloud-auth = { version = "1.16", default-features = false, features = ["default-rustls-provider"] }
parking_lot = "0.12"
opentelemetry = { version = "0.32", features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "metrics", "trace", "tls-ring"] }
opentelemetry_sdk = { version = "0.32", features = ["metrics", "rt-tokio", "trace"] }
prost = "0.14"
proptest = "1.7"
rand = "0.9"
redis = { version = "0.32", features = ["aio", "tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
schemars = { version = "1.0", features = ["chrono04"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
subtle = "2.6"
tempfile = "3.21"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tokio-util = "0.7"
tokio-stream = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots", "transport"] }
tonic-prost = "0.14"
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6", features = ["catch-panic", "compression-gzip", "cors", "limit", "request-id", "trace"] }
tower-service = "0.3"
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
url = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Keep contributor builds small enough for constrained CI/dev volumes.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
