AWSTemplateFormatVersion: '2010-09-09'
Description: Private-by-default InferQoS ECS/Fargate service
Parameters:
  Image:
    Type: String
    Default: "ghcr.io/dlamaro96/inferqos:0.1.0"
  VpcId:
    Type: "AWS::EC2::VPC::Id"
  Subnets:
    Type: "List<AWS::EC2::Subnet::Id>"
  ConfigSecretArn:
    Type: String
    Description: Secrets Manager ARN containing the InferQoS YAML
Resources:
  Cluster:
    Type: "AWS::ECS::Cluster"
    Properties:
      ClusterName: inferqos
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
  LogGroup:
    Type: "AWS::Logs::LogGroup"
    Properties:
      RetentionInDays: 30
  TaskRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: "sts:AssumeRole"
  ExecutionRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
      Policies:
        - PolicyName: ConfigSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: "secretsmanager:GetSecretValue"
                Resource:
                  Ref: ConfigSecretArn
  SecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: InferQoS internal ingress
      VpcId:
        Ref: VpcId
  Task:
    Type: "AWS::ECS::TaskDefinition"
    Properties:
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn:
        Fn::GetAtt: [ExecutionRole, Arn]
      TaskRoleArn:
        Fn::GetAtt: [TaskRole, Arn]
      ContainerDefinitions:
        - Name: inferqos
          Image:
            Ref: Image
          Essential: true
          ReadonlyRootFilesystem: true
          PortMappings:
            - ContainerPort: 8080
            - ContainerPort: 9090
          Secrets:
            - Name: INFERQOS_CONFIG_YAML
              ValueFrom:
                Ref: ConfigSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Ref: LogGroup
              awslogs-region:
                Ref: "AWS::Region"
              awslogs-stream-prefix: inferqos
  Service:
    Type: "AWS::ECS::Service"
    Properties:
      Cluster:
        Ref: Cluster
      DesiredCount: 2
      LaunchType: FARGATE
      TaskDefinition:
        Ref: Task
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - Ref: SecurityGroup
          Subnets:
            Ref: Subnets
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
