{{- if .Values.config }}
apiVersion: v1
kind: Secret
metadata: { name: {{ .Values.configSecretName }} }
type: Opaque
stringData:
  inferqos.yaml: |-
{{ .Values.config | indent 4 }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ .Release.Name }} }
spec:
  replicas: {{ .Values.replicaCount }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app.kubernetes.io/name: inferqos, app.kubernetes.io/instance: {{ .Release.Name }} } }
  template:
    metadata: { labels: { app.kubernetes.io/name: inferqos, app.kubernetes.io/instance: {{ .Release.Name }} } }
    spec:
      terminationGracePeriodSeconds: 35
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app.kubernetes.io/name: inferqos } } }
      containers:
        - name: inferqos
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--config", "/etc/inferqos/inferqos.yaml"]
          ports: [{ name: proxy, containerPort: 8080 }, { name: admin, containerPort: 9090 }]
          readinessProbe: { httpGet: { path: /health/ready, port: admin }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health/live, port: admin }, periodSeconds: 10 }
          lifecycle: { preStop: { exec: { command: ["/usr/local/bin/inferqos", "version"] } } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts: [{ name: config, mountPath: /etc/inferqos, readOnly: true }, { name: tmp, mountPath: /tmp }]
      volumes: [{ name: config, secret: { secretName: {{ .Values.configSecretName }} } }, { name: tmp, emptyDir: { sizeLimit: 64Mi } }]
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }} }
spec:
  selector: { app.kubernetes.io/name: inferqos, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: proxy, port: {{ .Values.service.port }}, targetPort: proxy }, { name: admin, port: {{ .Values.service.adminPort }}, targetPort: admin }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: {{ .Release.Name }} }
spec: { minAvailable: 1, selector: { matchLabels: { app.kubernetes.io/name: inferqos, app.kubernetes.io/instance: {{ .Release.Name }} } } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ .Release.Name }} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: inferqos } }
  policyTypes: [Ingress, Egress]
  ingress: [{ ports: [{ port: proxy }, { port: admin }] }]
  egress: [{}]
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: {{ .Release.Name }} }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ .Release.Name }} }
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }} } } }]
{{- end }}
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: {{ .Release.Name }} }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: inferqos, app.kubernetes.io/instance: {{ .Release.Name }} } }
  endpoints: [{ port: admin, path: /metrics, interval: {{ .Values.serviceMonitor.interval }} }]
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations: {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required when ingress is enabled" .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}, port: { name: proxy } } }
{{- end }}
