replicaCount: 2
image:
  repository: ghcr.io/dlamaro96/inferqos
  tag: "v0.2.1"
  pullPolicy: IfNotPresent
configSecretName: inferqos-config
config: ""
service: { port: 8080, adminPort: 9090 }
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: "1", memory: 512Mi }
autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 10, targetCPUUtilizationPercentage: 70 }
serviceMonitor: { enabled: false, interval: 15s }
ingress: { enabled: false, className: "", host: "", annotations: {} }
