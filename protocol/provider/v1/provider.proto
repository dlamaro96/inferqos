syntax = "proto3";
package inferqos.provider.v1;

service ProviderAdapter {
  rpc Estimate(EstimateRequest) returns (WorkEstimate);
  rpc Dispatch(DispatchRequest) returns (stream DispatchResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}
message EstimateRequest { string method = 1; string path = 2; map<string,string> safe_headers = 3; bytes body = 4; }
message WorkEstimate { uint64 input_tokens = 1; uint64 output_tokens = 2; uint64 cached_input_tokens = 3; double normalized_units = 4; float confidence = 5; string source = 6; double provider_cost_coefficient = 7; }
message DispatchRequest { string request_id = 1; string method = 2; string path = 3; map<string,string> safe_headers = 4; bytes body = 5; }
message DispatchResponse { uint32 status = 1; map<string,string> safe_headers = 2; bytes data = 3; bool end = 4; WorkEstimate usage = 5; }
message HealthRequest {}
message HealthResponse { bool healthy = 1; string detail = 2; }
