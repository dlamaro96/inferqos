openapi: 3.1.0
info:
  title: InferQoS Management API
  version: 0.2.0
  description: Metadata-only operational API. Prompt and completion content is never returned.
servers:
  - url: http://127.0.0.1:9090
paths:
  /health/live:
    get:
      security: []
      responses:
        '200': { description: Process is live }
  /health/ready:
    get:
      security: []
      responses:
        '200':
          description: Ready for traffic
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503': { description: Draining or dependency unavailable }
  /metrics:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Prometheus text metrics
          content: { text/plain: { schema: { type: string } } }
        '401': { description: Admin authentication required }
  /api/v1/status:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Runtime status and monotonic counters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeStatus' }
        '401': { description: Admin authentication required }
  /api/v1/capacity:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Capacity pool calibration and reservations
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { $ref: '#/components/schemas/CapacityStatus' }
        '401': { description: Admin authentication required }
  /api/v1/queues:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Bounded queue metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueSnapshot' }
        '401': { description: Admin authentication required }
  /api/v1/decisions:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Metadata-only bounded decision history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Decision' }
        '401': { description: Admin authentication required }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    Readiness:
      type: object
      required: [status, pools, usable_pools]
      properties:
        status: { type: string, enum: [ready] }
        pools: { type: integer, minimum: 0 }
        usable_pools: { type: integer, minimum: 0 }
    QueueSnapshot:
      type: object
      required: [depth, bytes, active_queues]
      properties:
        depth: { type: integer, minimum: 0 }
        bytes: { type: integer, minimum: 0 }
        active_queues: { type: integer, minimum: 0 }
    Counters:
      type: object
      required: [requests, admitted, queued, rejected, shadow_would_queue, provider_throttles]
      properties:
        requests: { type: integer, minimum: 0 }
        admitted: { type: integer, minimum: 0 }
        queued: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
        shadow_would_queue: { type: integer, minimum: 0 }
        provider_throttles: { type: integer, minimum: 0 }
    RuntimeStatus:
      type: object
      required: [version, mode, draining, uptime_seconds, active, queue, counters]
      properties:
        version: { type: string }
        mode: { type: string, enum: [shadow, enforce] }
        draining: { type: boolean }
        uptime_seconds: { type: integer, minimum: 0 }
        active: { type: integer, minimum: 0 }
        queue: { $ref: '#/components/schemas/QueueSnapshot' }
        counters: { $ref: '#/components/schemas/Counters' }
    CapacityStatus:
      type: object
      required: [configured_units, reserved_units, safety_factor, estimate_error_ewma, throttle_ewma, confidence, observations]
      properties:
        configured_units: { type: number, minimum: 0 }
        reserved_units: { type: number, minimum: 0 }
        safety_factor: { type: number, minimum: 1, maximum: 4 }
        estimate_error_ewma: { type: number, minimum: 0 }
        throttle_ewma: { type: number, minimum: 0, maximum: 1 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        observations: { type: integer, minimum: 0 }
    Decision:
      type: object
      required: [request_id, effective_class, tenant, application, pool, estimated_work_units, outcome, queue_age_ms]
      properties:
        request_id: { type: string, format: uuid }
        effective_class: { type: string }
        tenant: { type: string }
        application: { type: string }
        pool: { type: string }
        estimated_work_units: { type: number, minimum: 0 }
        outcome: { type: string }
        queue_age_ms: { type: integer, minimum: 0 }
