<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">InferQoS architecture and trust boundaries</title>
  <desc id="desc">Applications and optional gateways send requests into the InferQoS data plane. Identity, policy, work estimation, fair scheduling, and capacity control decide whether work is admitted to provider capacity. An internal admin plane exposes operations metadata, and Valkey coordinates high availability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f5f0"/><stop offset="1" stop-color="#eef1f6"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f6ff"/><stop offset="1" stop-color="#e9eefb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#30466f" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#315fe8"/></marker>
    <style>
      .label{font-family:Manrope,ui-sans-serif,system-ui,sans-serif;fill:#17202d}.muted{fill:#647184}.accent{fill:#315fe8}.tiny{font-size:14px;letter-spacing:.12em}.small{font-size:16px}.body{font-size:18px}.heading{font-size:24px;font-weight:700}.title{font-size:34px;font-weight:750}.box{fill:#fbfaf7;stroke:#c8d0dd;stroke-width:1.5}.line{stroke:#315fe8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#9ba9bc;stroke-width:1.5;stroke-dasharray:7 8;fill:none}.pill{fill:#fff;stroke:#bdc8d8;stroke-width:1.25}
    </style>
  </defs>
  <rect width="1440" height="760" rx="28" fill="url(#bg)"/>
  <text x="72" y="72" class="label tiny accent">REQUEST PATH · TRUST BOUNDARIES · HA</text>
  <text x="72" y="116" class="label title">One control point for finite inference capacity</text>
  <text x="72" y="149" class="label body muted">Transparent proxying stays separate from identity, policy, scheduling, and capacity accounting.</text>

  <rect x="54" y="194" width="224" height="390" rx="22" class="box"/>
  <text x="82" y="232" class="label tiny muted">UNTRUSTED / EDGE</text>
  <rect x="82" y="263" width="168" height="82" rx="14" class="pill"/>
  <text x="166" y="298" text-anchor="middle" class="label heading">Applications</text>
  <text x="166" y="323" text-anchor="middle" class="label small muted">OpenAI-compatible</text>
  <path d="M166 345 V389" class="line"/>
  <rect x="82" y="390" width="168" height="94" rx="14" class="pill"/>
  <text x="166" y="424" text-anchor="middle" class="label heading">Gateway</text>
  <text x="166" y="450" text-anchor="middle" class="label small muted">optional</text>
  <text x="166" y="473" text-anchor="middle" class="label small muted">APIM · Kong · Envoy</text>
  <text x="82" y="545" class="label small muted">Authenticates callers</text>
  <text x="82" y="568" class="label small muted">Preserves tracing</text>

  <rect x="338" y="180" width="666" height="420" rx="26" fill="url(#core)" stroke="#7591e9" stroke-width="2" filter="url(#shadow)"/>
  <path d="M250 437 H306 V347 H374" class="line"/>
  <text x="374" y="224" class="label tiny accent">INFERQOS DATA PLANE</text>
  <text x="374" y="264" class="label heading">Decide who should consume capacity now</text>

  <rect x="374" y="300" width="174" height="94" rx="14" class="pill"/>
  <text x="461" y="336" text-anchor="middle" class="label body">Identity</text>
  <text x="461" y="363" text-anchor="middle" class="label small muted">OIDC · mTLS · keys</text>
  <path d="M548 347 H582" class="line"/>
  <rect x="582" y="300" width="174" height="94" rx="14" class="pill"/>
  <text x="669" y="336" text-anchor="middle" class="label body">Policy</text>
  <text x="669" y="363" text-anchor="middle" class="label small muted">class · share · limits</text>
  <path d="M756 347 H790" class="line"/>
  <rect x="790" y="300" width="178" height="94" rx="14" class="pill"/>
  <text x="879" y="336" text-anchor="middle" class="label body">Work estimate</text>
  <text x="879" y="363" text-anchor="middle" class="label small muted">tokens → work units</text>

  <path d="M879 394 V432" class="line"/>
  <rect x="582" y="432" width="374" height="104" rx="16" fill="#f8faff" stroke="#315fe8" stroke-width="1.75"/>
  <text x="769" y="470" text-anchor="middle" class="label heading">Fair QoS scheduler</text>
  <text x="769" y="499" text-anchor="middle" class="label small muted">deadline pressure · aging · guarantees · borrowing</text>
  <text x="769" y="522" text-anchor="middle" class="label small muted">admit now · wait · reject visibly</text>
  <rect x="374" y="432" width="174" height="104" rx="14" class="pill"/>
  <text x="461" y="470" text-anchor="middle" class="label body">Capacity model</text>
  <text x="461" y="497" text-anchor="middle" class="label small muted">reserve · observe</text>
  <text x="461" y="520" text-anchor="middle" class="label small muted">reconcile · learn</text>
  <path d="M548 484 H582" class="line"/>
  <text x="374" y="570" class="label small muted">Streaming response is never fully buffered · running calls are not preempted</text>

  <path d="M956 484 H1064" class="line"/>
  <text x="979" y="470" class="label tiny accent">ADMIT</text>
  <rect x="1064" y="194" width="322" height="390" rx="22" class="box"/>
  <text x="1092" y="232" class="label tiny muted">FINITE CAPACITY POOLS</text>
  <rect x="1092" y="263" width="266" height="70" rx="14" class="pill"/><text x="1225" y="306" text-anchor="middle" class="label body">Azure provisioned</text>
  <rect x="1092" y="349" width="266" height="70" rx="14" class="pill"/><text x="1225" y="392" text-anchor="middle" class="label body">AWS Bedrock</text>
  <rect x="1092" y="435" width="266" height="70" rx="14" class="pill"/><text x="1225" y="478" text-anchor="middle" class="label body">Google Vertex AI</text>
  <rect x="1092" y="521" width="266" height="42" rx="14" class="pill"/><text x="1225" y="548" text-anchor="middle" class="label small">Any finite OpenAI endpoint</text>

  <path d="M518 600 V654" class="dash"/>
  <rect x="338" y="654" width="360" height="66" rx="16" class="box"/>
  <text x="365" y="681" class="label tiny muted">HA ONLY</text><text x="365" y="706" class="label body">Valkey · atomic expiring capacity leases</text>
  <path d="M860 600 V654" class="dash"/>
  <rect x="730" y="654" width="656" height="66" rx="16" class="box"/>
  <text x="758" y="681" class="label tiny muted">INTERNAL ADMIN PLANE</text><text x="758" y="706" class="label body">health · metrics · queues · decisions · OTLP export</text>
</svg>
