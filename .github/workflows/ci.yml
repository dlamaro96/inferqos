name: CI
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }
concurrency: { group: 'ci-${{ github.workflow }}-${{ github.ref }}', cancel-in-progress: true }
jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - name: Verify Developer Certificate of Origin sign-off
        env:
          EVENT_NAME: '${{ github.event_name }}'
          BASE_SHA: '${{ github.event.pull_request.base.sha }}'
          HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
          BEFORE_SHA: '${{ github.event.before }}'
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]; then
            range="$BEFORE_SHA..HEAD"
          else
            range="HEAD^..HEAD"
          fi
          git log --format='%H' "$range" | while read -r commit; do
            if ! git show -s --format='%B' "$commit" | grep -qiE '^Signed-off-by: .+ <[^>]+>$'; then
              echo "Commit $commit lacks a valid Signed-off-by trailer." >&2
              exit 1
            fi
          done
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: docker run -d --name inferqos-nats -p 4222:4222 nats:2.11-alpine -js
      - run: INFERQOS_TEST_NATS_URL=nats://127.0.0.1:4222 cargo test -p inferqos-durable-queue --test nats_jetstream
      - run: TMPDIR=/tmp cargo run -p inferqos-config --example schema -- /tmp/schema.json && diff -u config.schema.json /tmp/schema.json
      - name: Validate every checked-in configuration
        env:
          INFERQOS_UPSTREAM: http://127.0.0.1:18080/
          INFERQOS_UPSTREAM_API_KEY: placeholder-only-for-validation
        run: |
          cargo run --bin inferqos -- validate --config examples/minimal/demo.yaml
          cargo run --bin inferqos -- validate --config examples/external-provider/demo.yaml
          cargo run --bin inferqos -- validate --config inferqos.example.yaml
      - run: cargo build --locked --release --workspace
  sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - run: PYTHONPATH=sdk/python python -m unittest discover -s sdk/python/tests
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '20' }
      - run: npm test
        working-directory: sdk/typescript
      - run: go test ./...
        working-directory: sdk/go
  public-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '20' }
      - run: node --check web/site/site.js && node --check web/site/demo/demo.js
      - run: docker build -f web/site/Dockerfile -t inferqos-site:ci .
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: inferqos-site:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
      - run: docker run --rm -d --name inferqos-site --read-only -p 3000:8080 inferqos-site:ci
      - run: for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/healthz >/dev/null && break; sleep 0.2; done; tests/integration/site.sh
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build -f deploy/docker/Dockerfile -t inferqos:ci .
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: inferqos:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Lint workflows and shell entry points
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -shellcheck shellcheck
          find . -path './target' -prune -o -path './.git' -prune -o -type f -name '*.sh' -print0 | xargs -0 shellcheck
      - run: helm lint deploy/kubernetes/helm
      - run: if command -v terraform >/dev/null; then terraform fmt -check deploy/azure/container-apps/terraform; else docker run --rm -v "$PWD:/src" -w /src hashicorp/terraform:1.9 fmt -check deploy/azure/container-apps/terraform; fi
      - run: az bicep build --file deploy/azure/container-apps/main.bicep --stdout >/dev/null
