name: CI
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo run -p inferqos-config --example schema -- /tmp/schema.json && diff -u config.schema.json /tmp/schema.json
      - run: INFERQOS_UPSTREAM=http://127.0.0.1:18080/ cargo run --bin inferqos -- validate --config examples/minimal/demo.yaml
      - run: cargo build --locked --release --workspace
  sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - run: python -m pip install ./sdk/python pytest && pytest sdk/python/tests
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '20' }
      - run: npm test
        working-directory: sdk/typescript
      - run: go test ./...
        working-directory: sdk/go
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build -f deploy/docker/Dockerfile .
      - run: helm lint deploy/kubernetes/helm
