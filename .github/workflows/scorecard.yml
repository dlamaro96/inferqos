name: OpenSSF Scorecard
on:
  branch_protection_rule:
  schedule: [{ cron: '17 3 * * 2' }]
  push: { branches: [main] }
permissions: { contents: read, security-events: write, id-token: write }
jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@f2ea147fec3c2f0d459703eba7405b5e9bcd8c8f # v2.4.2
        with: { results_file: results.sarif, results_format: sarif, publish_results: true }
      - uses: github/codeql-action/upload-sarif@3599b3baa15b485a2e49ef411a7a4bb2452e7f93 # v3
        with: { sarif_file: results.sarif }
