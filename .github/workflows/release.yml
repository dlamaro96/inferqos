name: Release
on:
  push: { tags: ['v*.*.*'] }
permissions: { contents: read }
jobs:
  binaries:
    permissions: { contents: read, id-token: write, attestations: write }
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, artifact: linux-amd64, portable_linux: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, artifact: linux-arm64, portable_linux: true }
          - { os: macos-15-intel, target: x86_64-apple-darwin, artifact: macos-amd64 }
          - { os: macos-15, target: aarch64-apple-darwin, artifact: macos-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, artifact: windows-amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build portable Linux binary on glibc 2.31
        if: matrix.portable_linux == true
        shell: bash
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/src" \
            --workdir /src \
            --env CARGO_HOME=/tmp/cargo \
            --env INFERQOS_GIT_SHA \
            --env INFERQOS_BUILD_TARGET \
            rust:1.98-bullseye@sha256:4730e387a220a08a365c77da3096544dde214f9d796c16284d4be45438cad4a9 \
            cargo build --locked --release --bin inferqos --target "${{ matrix.target }}"
        env:
          INFERQOS_GIT_SHA: ${{ github.sha }}
          INFERQOS_BUILD_TARGET: ${{ matrix.target }}
      - name: Smoke test Linux binary on Debian 11
        if: matrix.portable_linux == true
        shell: bash
        run: |
          docker run --rm \
            --volume "$PWD:/src:ro" \
            debian:bullseye-slim@sha256:e5b6442dd2e9684cf5e87d8338b5968f3b348636fc0be6d7850a381e3731a2bd \
            "/src/target/${{ matrix.target }}/release/inferqos" version
      - name: Install Rust toolchain
        if: matrix.portable_linux != true
        run: rustup toolchain install 1.98.1 --profile minimal --target ${{ matrix.target }}
      - name: Build native binary
        if: matrix.portable_linux != true
        run: cargo build --locked --release --bin inferqos --target ${{ matrix.target }}
        env:
          INFERQOS_GIT_SHA: ${{ github.sha }}
          INFERQOS_BUILD_TARGET: ${{ matrix.target }}
      - shell: bash
        run: |
          set -euo pipefail
          mkdir package
          bin="target/${{ matrix.target }}/release/inferqos"
          test -f "$bin" || bin="${bin}.exe"
          cp "$bin" package/
          cp LICENSE NOTICE README.md package/
          tar -czf "inferqos-${{ github.ref_name }}-${{ matrix.artifact }}.tar.gz" -C package .
      - id: provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: 'inferqos-*.tar.gz' }
      - name: Retry provenance attestation once
        if: steps.provenance.outcome == 'failure'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: 'inferqos-*.tar.gz' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: '${{ matrix.artifact }}', path: 'inferqos-*.tar.gz' }
  container-arch:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux/amd64, suffix: amd64 }
          - { os: ubuntu-24.04-arm, platform: linux/arm64, suffix: arm64 }
    runs-on: ${{ matrix.os }}
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Build and push runtime architecture
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: '.'
          file: deploy/docker/Dockerfile
          platforms: '${{ matrix.platform }}'
          push: true
          tags: 'ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ matrix.suffix }}'
          labels: |
            org.opencontainers.image.title=InferQoS
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
          build-args: INFERQOS_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push fake-provider architecture
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: '.'
          file: deploy/docker/Dockerfile.fake
          platforms: '${{ matrix.platform }}'
          push: true
          tags: 'ghcr.io/${{ github.repository }}:fake-${{ github.ref_name }}-${{ matrix.suffix }}'
          labels: |
            org.opencontainers.image.title=InferQoS deterministic fake provider
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
  container:
    needs: container-arch
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Publish runtime and fake-provider multi-architecture indexes
        id: indexes
        shell: bash
        run: |
          set -euo pipefail
          runtime="ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          docker buildx imagetools create --tag "$runtime" --tag "ghcr.io/${{ github.repository }}:latest" \
            "${runtime}-amd64" "${runtime}-arm64"
          runtime_digest="sha256:$(docker buildx imagetools inspect "$runtime" --raw | sha256sum | awk '{print $1}')"

          fake="ghcr.io/${{ github.repository }}:fake-${{ github.ref_name }}"
          docker buildx imagetools create --tag "$fake" "${fake}-amd64" "${fake}-arm64"
          fake_digest="sha256:$(docker buildx imagetools inspect "$fake" --raw | sha256sum | awk '{print $1}')"

          echo "runtime_digest=$runtime_digest" >> "$GITHUB_OUTPUT"
          echo "fake_digest=$fake_digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign multi-architecture image indexes
        run: |
          cosign sign --yes 'ghcr.io/${{ github.repository }}@${{ steps.indexes.outputs.runtime_digest }}'
          cosign sign --yes 'ghcr.io/${{ github.repository }}@${{ steps.indexes.outputs.fake_digest }}'
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with: { image: 'ghcr.io/${{ github.repository }}@${{ steps.indexes.outputs.runtime_digest }}', artifact-name: image.spdx.json, output-file: image.spdx.json }
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with: { image: 'ghcr.io/${{ github.repository }}@${{ steps.indexes.outputs.fake_digest }}', artifact-name: fake-image.spdx.json, output-file: fake-image.spdx.json }
  publish:
    needs: [binaries, container]
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write, attestations: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { path: artifacts, pattern: '*-amd64', merge-multiple: true }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { path: artifacts, pattern: '*-arm64', merge-multiple: true }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { path: artifacts, name: image.spdx.json }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { path: artifacts, name: fake-image.spdx.json }
      - run: cd artifacts && sha256sum ./*.tar.gz ./*.spdx.json > SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksum manifest with keyless Sigstore identity
        run: cosign sign-blob --yes --bundle artifacts/SHA256SUMS.bundle artifacts/SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with: { generate_release_notes: true, files: 'artifacts/*' }
