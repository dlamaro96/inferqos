name: Release
on:
  push: { tags: ['v*.*.*'] }
permissions: { contents: read }
jobs:
  binaries:
    permissions: { contents: read, id-token: write, attestations: write }
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, artifact: linux-amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, artifact: linux-arm64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, artifact: macos-amd64 }
          - { os: macos-15, target: aarch64-apple-darwin, artifact: macos-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, artifact: windows-amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.98.1 --profile minimal --target ${{ matrix.target }}
      - run: cargo build --locked --release --bin inferqos --target ${{ matrix.target }}
        env:
          INFERQOS_GIT_SHA: ${{ github.sha }}
          INFERQOS_BUILD_TARGET: ${{ matrix.target }}
      - shell: bash
        run: |
          set -euo pipefail
          mkdir package
          bin="target/${{ matrix.target }}/release/inferqos"
          test -f "$bin" || bin="${bin}.exe"
          cp "$bin" package/
          cp LICENSE NOTICE README.md package/
          tar -czf "inferqos-${{ github.ref_name }}-${{ matrix.artifact }}.tar.gz" -C package .
      - id: provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with: { subject-path: 'inferqos-*.tar.gz' }
      - name: Retry provenance attestation once
        if: steps.provenance.outcome == 'failure'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with: { subject-path: 'inferqos-*.tar.gz' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: '${{ matrix.artifact }}', path: 'inferqos-*.tar.gz' }
  container:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: '.'
          file: deploy/docker/Dockerfile
          platforms: 'linux/amd64,linux/arm64'
          push: true
          tags: 'ghcr.io/${{ github.repository }}:${{ github.ref_name }},ghcr.io/${{ github.repository }}:latest'
          labels: |
            org.opencontainers.image.title=InferQoS
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
          build-args: INFERQOS_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - run: cosign sign --yes 'ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}'
      - uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with: { image: 'ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}', artifact-name: image.spdx.json, output-file: image.spdx.json }
      - id: fake-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: '.'
          file: deploy/docker/Dockerfile.fake
          platforms: 'linux/amd64,linux/arm64'
          push: true
          tags: 'ghcr.io/${{ github.repository }}:fake-${{ github.ref_name }}'
          labels: |
            org.opencontainers.image.title=InferQoS deterministic fake provider
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: cosign sign --yes 'ghcr.io/${{ github.repository }}@${{ steps.fake-build.outputs.digest }}'
      - uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with: { image: 'ghcr.io/${{ github.repository }}@${{ steps.fake-build.outputs.digest }}', artifact-name: fake-image.spdx.json, output-file: fake-image.spdx.json }
  publish:
    needs: [binaries, container]
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write, attestations: read }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: artifacts, pattern: '*-amd64', merge-multiple: true }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: artifacts, pattern: '*-arm64', merge-multiple: true }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: artifacts, name: image.spdx.json }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: artifacts, name: fake-image.spdx.json }
      - run: cd artifacts && sha256sum ./*.tar.gz ./*.spdx.json > SHA256SUMS
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Sign checksum manifest with keyless Sigstore identity
        run: cosign sign-blob --yes --bundle artifacts/SHA256SUMS.bundle artifacts/SHA256SUMS
      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with: { generate_release_notes: true, files: 'artifacts/*' }
