name: Stress and portability
on:
  workflow_dispatch:
  schedule: [{ cron: '17 3 * * 2' }]
permissions: { contents: read }
jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --locked
      - run: cargo +nightly fuzz run config-yaml -- -max_total_time=120 -rss_limit_mb=2048
  architectures:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: macos-15, target: aarch64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.98.1 --profile minimal --target ${{ matrix.target }}
      - run: cargo build --locked --release --bin inferqos --target ${{ matrix.target }}
      - shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/inferqos"
          test -x "$binary" || test -f "${binary}.exe"
  load-and-chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cargo build --workspace
      - name: Start finite provider and InferQoS
        run: |
          target/debug/inferqos-fake-provider --concurrency 4 --latency-ms 20 > /tmp/fake.log 2>&1 & echo $! > /tmp/fake.pid
          INFERQOS_UPSTREAM=http://127.0.0.1:18080/ target/debug/inferqos serve --config examples/minimal/demo.yaml > /tmp/inferqos.log 2>&1 & echo $! > /tmp/inferqos.pid
          for _ in $(seq 1 100); do curl -fsS http://127.0.0.1:9090/health/ready >/dev/null && exit 0; sleep 0.1; done
          cat /tmp/inferqos.log; exit 1
      - run: tests/load/local_saturation.sh
      - run: tests/integration/hot_reload_and_spool.sh
      - run: INFERQOS_FAKE_PROVIDER_PID=$(cat /tmp/fake.pid) tests/chaos/local_faults.sh
