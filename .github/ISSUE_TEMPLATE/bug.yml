name: Bug
description: Report a reproducible defect
body:
  - type: textarea
    id: behavior
    attributes: { label: Observed behavior }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: InferQoS version }
    validations: { required: true }
  - type: textarea
    id: diagnostics
    attributes: { label: Sanitized diagnostics, description: Never include secrets or request content. }

